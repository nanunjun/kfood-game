name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 15 --model claude-opus-4-8"

  claude-ready-for-dev:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready-for-dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Implement from issue spec
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 15 --model claude-opus-4-8"
          prompt: |
            이 이슈(#${{ github.event.issue.number }})에 'ready-for-dev' 라벨이 붙어 개발 요청이 들어왔습니다.

            이슈 제목: ${{ github.event.issue.title }}

            이슈 본문(spec):
            ---
            ${{ github.event.issue.body }}
            ---

            작업 절차:
            1. 위 이슈 본문의 spec을 정확히 읽고 요구사항을 파악하세요.
            2. spec이 충분히 명확한 경우에만 코드를 작성합니다.
               - 코드 변경은 godot-project/scripts/ 안에서만 수행하세요.
               - 단, .tscn 씬 파일이나 project.godot 수정이 필요한 경우에 한해 godot-project/ 하위까지 허용합니다.
               - 작업용 새 브랜치를 만들고 변경사항을 커밋한 뒤, 이 이슈를 닫는(Closes #${{ github.event.issue.number }}) 설명이 포함된 Pull Request를 생성하세요.
            3. spec이 모호하면 코드를 작성하지 말고, 이 이슈에 무엇이 불명확한지 구체적으로 코멘트만 남기세요. 코드와 PR은 만들지 마세요.

            제약: 코드 구현은 godot-project/scripts/ 에 한정합니다 (단 .tscn / project.godot 수정 시 godot-project/ 하위 허용).
